version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stocksignalpl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockuser
      POSTGRES_PASSWORD: stockpassword123!
      POSTGRES_DB: stocksignalpl
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockuser -d stocksignalpl"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stocksignalpl-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://stockuser:stockpassword123!@postgres:5432/stocksignalpl
    ports:
      - "3000:3000"

volumes:
  postgres_data:
    driver: local
